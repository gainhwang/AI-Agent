<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>실손의료보험 PDF 비교</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <h1>실손의료보험 PDF 비교</h1>
    <p class="muted">약관 PDF 두 개를 올리면 보상·자기부담금·한도·면책 조항을 근거와 함께 비교합니다.</p>

    <section class="card" aria-label="비교 조건">
      <form id="compare-form">
        <label for="first">첫 번째 약관 PDF</label>
        <input id="first" name="first" type="file" accept=".pdf,application/pdf" required>
        <label for="second">두 번째 약관 PDF</label>
        <input id="second" name="second" type="file" accept=".pdf,application/pdf" required>
        <label for="topic">비교 항목</label>
        <select id="topic" name="topic">
          <option value="all">전체 4개 항목</option>
          <option value="therapy">비급여 도수치료</option>
          <option value="deductible">상해입원 자기부담금</option>
          <option value="limit">상해입원 보장 한도</option>
          <option value="exclusion">임신·출산 관련 면책 사항</option>
        </select>
        <button id="submit" type="submit">PDF 비교하기</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="result" class="card" hidden>
      <h2>약관 비교 결과</h2>
      <p id="file-names" class="muted"></p>
      <div class="table-scroll">
        <table>
          <thead><tr><th>비교 항목</th><th>첫 번째 PDF</th><th>두 번째 PDF</th><th>차이 요약</th></tr></thead>
          <tbody id="result-rows"></tbody>
        </table>
      </div>
      <p class="notice">PDF 원문을 바탕으로 자동 생성한 비교입니다. 각 행의 근거와 실제 가입 내용을 확인하세요. 서로 다른 보장 유형은 직접 비교를 보류합니다.</p>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
